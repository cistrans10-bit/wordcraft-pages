[package]
name = "wordcraft-pdfedit"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WordCraft PDF editing: markup, page organizing, stamps, forms, redaction, encryption, as edits replayed over a PDF"

[lints]
workspace = true

[dependencies]
wordcraft-fonts = { workspace = true }
wordcraft-pdfread = { workspace = true }
# Reading, changing and writing PDF objects (MIT), without its clock and thread-pool defaults.
lopdf = { workspace = true }
kurbo = { workspace = true }
image = { workspace = true }
log = { workspace = true }
getrandom = { workspace = true }

# The browser's `crypto.getRandomValues` for the file ID of encrypted saves.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }
# lopdf's own (newer) getrandom, for its encryption keys.
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
